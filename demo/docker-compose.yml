# Demo stack for ibq_whatsapp_helpdesk.
#
#   docker compose -f demo/docker-compose.yml up -d
#   http://localhost:8069   (login: admin / admin)
#
# Odoo Community, because the Enterprise image is not public. The helpdesk
# dependency is satisfied by the deliberately minimal stub in demo/addons.
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - dbdata:/var/lib/postgresql/data

  odoo:
    image: odoo:17
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      # The module under development, plus the helpdesk stub it depends on.
      - ..:/mnt/project:ro
      - ./addons:/mnt/demo-addons:ro
      - odoodata:/var/lib/odoo
    command: >
      odoo
      --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/demo-addons,/mnt/project
      --database=demo
      --db_host=db --db_user=odoo --db_password=odoo
      --without-demo=all
      --limit-time-real=600

volumes:
  dbdata:
  odoodata:
